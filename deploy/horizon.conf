# /etc/supervisor/conf.d/cms-horizon.conf
#   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start cms-horizon
#
# Horizon runs every queue worker (social publishing, SIAKAD forwarding,
# image conversions, notifications). deploy.sh restarts it after each release.

[program:cms-horizon]
process_name=%(program_name)s
command=php /var/www/cms/current/artisan horizon
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Longer than the slowest job (PublishSocialTarget: 300 s) so a restart lets it finish.
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/var/www/cms/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
