# /etc/nginx/sites-available/cms  (symlink into sites-enabled)
#
# One Laravel app serves three hosts: the admin panel and both public sites.
# Replace the example domains and the PHP-FPM socket version, then:
#   sudo certbot --nginx -d admin.pondok.example -d pondok.example -d www.pondok.example -d mahad.example -d www.mahad.example

server {
    listen 80;
    listen [::]:80;
    server_name admin.pondok.example pondok.example www.pondok.example mahad.example www.mahad.example;
    return 301 https://$host$request_uri;
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pondok.example;
    # ssl_certificate lines are added by certbot
    return 301 https://pondok.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mahad.example;
    return 301 https://mahad.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.pondok.example pondok.example mahad.example;

    root /var/www/cms/current/public;
    index index.php;
    charset utf-8;

    # Media upload form allows 12 MB per file.
    client_max_body_size 20M;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files: long cache, never executed, and sandboxed so an
    # uploaded document or SVG cannot run scripts on the CMS domains.
    location /storage/ {
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Anything else ending in .php, and dotfiles (.env, .git), is refused.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
